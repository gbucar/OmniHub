# ============================================================================
# PR Checks — dev
# ============================================================================
# Runs on pull requests targeting `dev` or `master`.
# Two parallel jobs must pass before merging:
#   1. lint-and-build — typecheck, format, production build (~2 min)
#   2. e2e-tests      — Playwright E2E tests against a fresh Docker stack (~90 s)
#
# E2E tests use workers: 2 (2× speedup vs. serial). Two concurrent workers
# are safe for PostgREST load — tests within each spec file stay sequential
# and the seed data is deterministic.
# ============================================================================

name: PR Checks — dev

on:
  pull_request:
    branches: [dev, master]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint, typecheck, and build the SvelteKit admin dashboard.
  # Fast feedback — catches obvious issues before E2E tests.
  # --------------------------------------------------------------------------
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------
  # Job 2: E2E tests with Playwright against a fresh Docker stack.
  # Uses docker-compose.test.yml to spin up an isolated environment
  # with deterministic seed data, then runs all Playwright specs.
  # --------------------------------------------------------------------------
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Docker Compose reads variables from .env in the project directory.
      # .env.example already contains correct local-development passwords.
      - name: Setup .env
        run: cp .env.example .env

      # --- Start test infrastructure ---

      # Replace dev populate migrations (98_atmotubes.sql, 99_*.sql) with deterministic test seed.
      # Seed contains all test data - delete old migrations, copy seed.sql as new migration.
      - name: Swap dev data with test seed
        run: |
          rm -f src/db/migrations/9[89]_*.sql
          cp tests/e2e/seed.sql src/db/migrations/98_seed_test_data.sql

      - name: Start database
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d --wait db

      - name: Start API
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d postgrest

      - name: Wait for PostgREST
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ PostgREST ready"
              exit 0
            fi
            echo "⏳ Waiting for PostgREST… ($i/30)"
            sleep 2
          done
          echo "❌ PostgREST not ready after 60s"
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs postgrest
          exit 1

      - name: Start admin dashboard
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d admin-dashboard

      - name: Wait for admin dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Admin dashboard ready"
              exit 0
            fi
            echo "⏳ Waiting for admin dashboard… ($i/30)"
            sleep 2
          done
          echo "❌ Admin dashboard not ready after 60s"
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs admin-dashboard
          exit 1

      # --- Install test deps and run tests in the Playwright container ---
      # node_modules is required because the playwright-tests service mounts
      # ./tests/e2e into the container. No browser download — the
      # mcr.microsoft.com/playwright image already contains Chromium.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci

      # --no-deps: db/postgrest/admin-dashboard are already up and seeded;
      # avoids re-running the test-seed service. -T: no TTY on CI runners.
      - name: Run E2E tests
        timeout-minutes: 8
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            run --rm --no-deps -T playwright-tests

      # --- Artifacts & cleanup ---

      - name: Debug — postgrest logs
        if: failure()
        run: |
          echo "=== POSTGREST LOGS ==="
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs postgrest || true
          echo "=== DB LOGS (last 50 lines) ==="
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs db --tail 50 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/

      - name: Cleanup Docker stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            down -v
