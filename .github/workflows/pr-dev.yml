# ============================================================================
# PR Checks — dev
# ============================================================================
# Runs on pull requests targeting `dev` or `master`.
# Three parallel jobs must pass before merging:
#   1. lint-and-build          — typecheck, format, production build (~2 min)
#   2. e2e-tests-readonly      — auth + nav + devices specs, 4 workers (~45 s)
#   3. e2e-tests-mutations     — participants + studies specs, 1 worker (~90 s)
#
# Read-only and mutation tests run in separate Docker stacks (COMPOSE_PROJECT_NAME)
# so they are fully isolated. This allows read-only specs to use 4 parallel
# workers while mutation specs (which modify the database) stay serial.
# ============================================================================

name: PR Checks — dev

on:
  pull_request:
    branches: [dev, master]

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Lint, typecheck, and build the SvelteKit admin dashboard.
  # Fast feedback — catches obvious issues before E2E tests.
  # --------------------------------------------------------------------------
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------
  # Job 2: Read-only E2E tests — auth, navigation, devices.
  # These specs never mutate the database, so they can safely run
  # with 4 parallel workers in a single Docker stack.
  # --------------------------------------------------------------------------
  e2e-tests-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .env
        run: cp .env.example .env

      - name: Start database
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-ro \
            up -d --wait db

      - name: Seed test data
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-ro \
            run --rm test-seed

      - name: Start API
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-ro \
            up -d postgrest

      - name: Wait for PostgREST
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ PostgREST ready"
              exit 0
            fi
            echo "⏳ Waiting for PostgREST… ($i/30)"
            sleep 2
          done
          echo "❌ PostgREST not ready after 60s"
          exit 1

      - name: Start admin dashboard
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-ro \
            up -d admin-dashboard

      - name: Wait for admin dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Admin dashboard ready"
              exit 0
            fi
            echo "⏳ Waiting for admin dashboard… ($i/30)"
            sleep 2
          done
          echo "❌ Admin dashboard not ready after 60s"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run read-only E2E tests (4 workers)
        timeout-minutes: 8
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-ro \
            run --rm --no-deps -T playwright-tests \
              specs/auth.spec.ts \
              specs/navigation.spec.ts \
              specs/devices.spec.ts

      - name: Debug — postgrest logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p e2e-ro logs postgrest || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-readonly
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/

      - name: Cleanup Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p e2e-ro down -v

  # --------------------------------------------------------------------------
  # Job 3: Mutation E2E tests — participants, studies.
  # These specs create/edit data and must run serially (workers: 1)
  # in their own isolated Docker stack.
  # --------------------------------------------------------------------------
  e2e-tests-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .env
        run: cp .env.example .env

      - name: Start database
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-mut \
            up -d --wait db

      - name: Seed test data
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-mut \
            run --rm test-seed

      - name: Start API
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-mut \
            up -d postgrest

      - name: Wait for PostgREST
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ PostgREST ready"
              exit 0
            fi
            echo "⏳ Waiting for PostgREST… ($i/30)"
            sleep 2
          done
          echo "❌ PostgREST not ready after 60s"
          exit 1

      - name: Start admin dashboard
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-mut \
            up -d admin-dashboard

      - name: Wait for admin dashboard
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Admin dashboard ready"
              exit 0
            fi
            echo "⏳ Waiting for admin dashboard… ($i/30)"
            sleep 2
          done
          echo "❌ Admin dashboard not ready after 60s"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Run mutation E2E tests (1 worker, serial)
        timeout-minutes: 8
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            -p e2e-mut \
            run --rm --no-deps -T playwright-tests \
              --workers=1 \
              specs/participants.spec.ts \
              specs/studies.spec.ts

      - name: Debug — postgrest logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p e2e-mut logs postgrest || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mutations
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/

      - name: Cleanup Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -p e2e-mut down -v
