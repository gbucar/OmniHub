# docker-compose.test.yml
# Override za E2E testni stack.
# Uporaba:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

services:
  # --- Override: admin-dashboard se builda iz source ---
  admin-dashboard:
    build:
      context: ./src/admin-dashboard
    # odstranimo image — vedno build iz lokalne kode
    environment:
      - PUBLIC_POSTGREST_URL=${POSTGREST_URL:-http://postgrest:3000}
    ports:
      - "3001:5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # --- Override: postgrest healthcheck ---
  postgrest:
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  # --- NOVO: Enkratni seed service ---
  # Počaka, da so migracije končane, nato vstavi testne podatke.
  test-seed:
    image: docker.io/postgres:18
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./tests/e2e/seed.sql:/seed.sql:z
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "⏳ Waiting for database to accept connections..."
        until pg_isready -h db -U postgres -d postgres 2>/dev/null; do
          sleep 1
        done
        # Dodaten sleep, da se vse migracije končajo
        sleep 3
        echo "🌱 Seeding test data from /seed.sql..."
        psql "postgres://postgres:$${POSTGRES_PASSWORD}@db:5432/postgres" -v ON_ERROR_STOP=1 -f /seed.sql
        echo "✅ Seed complete."
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    restart: "no"

  # --- NE zaženemo pipelines v testnem stacku ---
  pipelines:
    profiles:
      - production
