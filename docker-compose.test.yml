# docker-compose.test.yml
# Override za E2E testni stack.
# Uporaba:
#   podman compose -f docker-compose.yml -f docker-compose.test.yml up \
#     admin-dashboard playwright-tests
#   podman compose -f docker-compose.yml -f docker-compose.test.yml down -v
#
# Testni podatki pridejo iz migracij — CI pred zagonom baze zamenja
# 9[89]_*.sql z seed.sql, tako da je baza deterministična že od začetka.
# Ločen seed korak ni potreben.

# --- Named volumes (test-specific, isolated from dev) ---
volumes:
  db-test-data:

services:
  # --- Override: db uporablja ločen volume za teste ---
  db:
    volumes:
      - db-test-data:/var/lib/postgresql:z
      - ./src/db/migrations:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Override: admin-dashboard za teste (Vite dev server) ---
  admin-dashboard:
    build:
      context: ./src/admin-dashboard
      dockerfile: Dockerfile.dev
    image: omnihub-admin-dashboard:test
    environment:
      - PUBLIC_POSTGREST_URL=http://postgrest:3000
      - HOST=0.0.0.0
      - PORT=5173
    ports:
      - "3001:5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: "no"
    depends_on:
      - postgrest

  # --- Override: postgrest ---
  postgrest:
    image: docker.io/postgrest/postgrest:v14.5
    restart: "no"
    depends_on:
      - db

  # --- Playwright test runner ---
  # Seed podatki so že v migracijah — ni potrebe po ločenem seed servisu.
  # Počaka le na admin-dashboard, nato požene teste.
  playwright-tests:
    image: mcr.microsoft.com/playwright:v1.62.0-jammy
    volumes:
      - ./tests/e2e:/tests:z
    working_dir: /tests
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Waiting for admin-dashboard..."
        for i in $(seq 1 30); do
          if wget -q -O- http://admin-dashboard:5173 >/dev/null 2>&1; then
            echo "Admin-dashboard ready"
            break
          fi
          sleep 2
        done
        echo "Running Playwright tests..."
        npx playwright test --reporter=list "$@"
        echo "Tests completed"
    environment:
      TEST_BASE_URL: http://admin-dashboard:5173
      CI: "true"
    restart: "no"
    depends_on:
      - admin-dashboard
      - postgrest

  # --- NE zaženemo pipelines v testnem stacku ---
  pipelines:
    profiles:
      - production
